  function helper(host){title(host,'哪句话说明小虫子帮上忙了？');const{card,body}=readingCard(host,'p5','lady');const fragments=[source('p5').segments[0],source('p5').segments[2]];const group=N('div','evidence-options');fragments.forEach((t,i)=>{const b=B('',()=>{if(i!==0)return retry();state.helper=true;success('evidence',{source:'p5',quote:t});render();},'phrase'+(state.helper&&i===0?' selected':''),'helper-'+i);b.append(N('span','pick-dot'),N('span','',t));b.disabled=state.helper;group.append(b);});body.append(group);showHint(card);if(state.helper)feedback(card,'七星瓢虫把蚜虫吃光了。');dock(host,'',state.helper?[primary('一起救棉花',()=>go('rescue'))]:[helpButton(),speakButton(fragments.join(''),'p5')]);}
  function rescue(host){title(host,'帮七星瓢虫找到蚜虫。',`${state.collected.length} / 5`);const land=landscape(host,{rescue:true});land.append(draw('leaf','rescue-leaf'));const positions=innerWidth<=600?[[18,61],[28,42],[47,51],[53,28],[67,41]]:[[29,64],[37,42],[48,56],[55,29],[65,43]];
    for(let i=0;i<5;i++){const b=B('',()=>catchBug(i,b),'bug-target'+(state.collected.includes(i)?' caught':''),'bug-'+i);b.style.left=positions[i][0]+'%';b.style.top=positions[i][1]+'%';b.setAttribute('aria-label',state.collected.includes(i)?`第${i+1}只蚜虫，已捉住`:`第${i+1}只蚜虫`);if(state.collected.includes(i)){b.append(icon('check'));b.disabled=true;}else b.append(draw('aphid'));land.append(b);}
    const bug=draw('lady','actor lady');bug.id='rescuer';land.append(bug);dock(host,state.collected.length===5?'棉花姑娘好起来啦！':'点一只蚜虫，小医生就出发。',state.collected.length===5?[primary('听听她说什么',()=>go('surprise'))]:[]);
  }
  async function catchBug(i,b){if(busy||state.collected.includes(i))return;busy=true;const mine=token,bug=document.querySelector('#rescuer');bug.style.left=b.style.left;bug.style.top=b.style.top;try{if(state.music)audio.click();await new Promise(resolve=>setTimeout(resolve,state.reduced?25:430));if(mine!==token||state.screen!=='rescue')return;state.collected.push(i);log('exploration',{action:'rescue',target:i});}finally{busy=false;}render();}
  function storyArt(i){if(i===0||i===3)return draw('cotton','thumb',i===3);if(i===1){const n=N('div','thumb story-scene');n.append(draw('swallow'),draw('frog'));return n;}return draw('lady','thumb');}
  function order(visitors){const host=document.querySelector('main'),items=visitors?['燕子','啄木鸟','青蛙']:['生病','求助','救援','康复'],selected=visitors?state.visitOrder:state.order;title(host,visitors?'课文里，谁先来？':'把故事排一排。');const grid=N('div','picture-grid story-grid');if(visitors)grid.classList.add('visitor-grid');const order=visitors?[2,0,1]:[2,0,3,1];for(const i of order){const pos=selected.indexOf(i),b=B('',()=>{selected.push(i);render();},'picture-choice'+(pos>=0?' selected':''),'sort-'+i);b.disabled=pos>=0;b.append(visitors?draw(['swallow','wood','frog'][i],'thumb'):storyArt(i),N('span','',items[i]));if(pos>=0)b.append(N('span','badge',String(pos+1)));grid.append(b);}host.append(grid);showHint(host);const next=primary('排好了',()=>{if(!selected.every((x,i)=>x===i)){selected.splice(0);retry();return;}success('sequence',{task:visitors?'visitors':'story'});go(visitors?'retell':'visit-order');},'check-order');next.disabled=selected.length!==items.length;const undo=B('撤回一步',()=>{selected.pop();render();},'text-button','undo');undo.disabled=selected.length===0;dock(host,'', [next,undo,helpButton()]);}
  function retell(host){const land=landscape(host,{bubble:'把我们的故事讲一讲。',happy:true});land.append(draw('lady','actor lady'));const row=N('div','path');['生病','求助','救援','康复'].forEach((text,i)=>{if(i)row.append(N('span','arrow','→'));row.append(N('span','',text));});row.style.marginTop='18px';host.append(row);dock(host,'讲给同桌听。',[primary('讲好了',()=>{state.oral.retell=true;log('oral_activity',{activity:'retell',quality:'not_assessed'});go('exit');},'retell-done'),B('给我开个头',()=>{log('oral_support',{activity:'retell'});const d=modal('试着接着说');d.body.append(N('p','frame-list','棉花姑娘遇到了……'),N('p','','她先向……求助，但是……'),N('p','','后来……最后……'));},'text-button','frames')]);}
  function exit(host){title(host,'啄木鸟为什么没能帮忙？');const land=landscape(host,{bubble:'这一次，试着自己说。',happy:true});land.append(draw('wood','actor wood'));if(state.exitHelp){const p=N('div','reading');p.style.marginTop='18px';textLabel(p,'p3');p.append(N('p','source-lines',source('p3').text));host.append(p);}dock(host,'说清楚它的本领。',[primary('我说好了',()=>{state.oral.exit=true;log('oral_activity',{activity:'exit',quality:'not_assessed',sourceOpened:state.exitHelp});go('finish');},'exit-done'),B('再看看课文',()=>{state.exitHelp=true;log('oral_support',{activity:'exit'});render();},'text-button','exit-help')]);}
  function finish(host){const section=N('div','finish'),hero=N('div','finish-hero');hero.append(draw('cotton','cotton',true),draw('lady','lady'));section.append(hero,N('span','soft-tag','这次小冒险，完成啦'));const h=N('h1','','棉花姑娘，笑啦！');h.tabIndex=-1;section.append(h,N('p','','把这段故事，讲给更多人听吧。'));const row=N('div','dock-actions');row.append(primary('再读一读',()=>openSource(['p1','p2','p3','p4','p5','p6']),'read-all'),B('从头再玩',()=>restartDialog(),'text-button','restart'));section.append(row);host.append(section);}
  function modal(titleText){document.querySelector('dialog')?.close();const d=N('dialog','modal'),h=N('header'),heading=N('h2','',titleText),close=B('关闭',()=>d.close(),'tool','close-dialog');h.append(heading,close);d.append(h);const body=N('div');d.append(body);document.body.append(d);const previous=document.activeElement;dialogOpen=true;root.classList.add('paused');audio.stop();stopSpeech();d.addEventListener('close',()=>{dialogOpen=false;d.remove();root.classList.remove('paused');if(state.music&&!document.hidden)audio.start().catch(()=>{});if(previous?.isConnected)previous.focus();},{once:true});d.showModal();return{dialog:d,body};}
  function openSource(ids){if(state.screen==='exit'&&!state.exitHelp)return;log('source_opened',{ids});const d=modal('课文原文');ids.forEach(id=>{const s=source(id);d.body.append(N('h3','',`第${s.page}页`),N('p','source-lines',s.text));});d.body.append(N('p','small','本页沿用上传文件中的转录。未重新见到教材照片，仍待教师审核。'));}
  function teacherGate(){const d=modal('教师入口');d.body.append(N('p','notice','打开后的说明也会显示在当前屏幕。投屏时请先暂停展示。'),N('p','','样机已减少儿童端说明文字；教学目标、依据和记录保留在这里。'));d.body.append(primary('进入教师页',()=>{d.dialog.close();teacher();},'teacher-enter'));}
  function teacher(){const d=modal('教师使用与记录');d.body.append(N('p','small','绘本轻界面 · 审美与交互样机。可走通精简主线；未迁移旧版完整支线、存档和细分记录。'),N('p','','先让学生独立想，再同桌说，最后请一人操作。判断、原文依据、朗读与复述都需结合真实表现观察。'));
    const actions=N('div','teacher-actions');actions.append(B('原文与核对边界',()=>{d.dialog.close();teacherSource();}),B('记录一次观察',()=>{d.dialog.close();observe();}),B('导出样机记录',()=>download()),B('课后检查卡',()=>{d.dialog.close();checkCard();}));d.body.append(actions);
    const motion=N('label'),input=N('input');input.type='checkbox';input.checked=state.reduced;input.addEventListener('change',()=>{state.reduced=input.checked;root.classList.toggle('no-motion',state.reduced);log('motion_setting',{reduced:state.reduced});});motion.append(input,document.createTextNode('减少动画'));d.body.append(motion);
    d.body.append(N('h3','','记录的边界'),N('p','','本机操作不代表全班掌握；“读好了”“讲好了”只记录活动开展。提示、原文支持与声音请求分别记录，不自动评分口头回答。样机记录只在当前页面内存中，关闭或刷新会丢失，请先导出。'),N('p','','原文沿用本次提供的转录记录；教师审核状态仍为未审核。五只蚜虫仅为操作数量。'),N('p','small','本文件没有联网配音、账号或外部依赖。点读只使用设备已有的本地中文声音；没有声音也能完成主线。'));
  }
  function teacherSource(){const d=modal('原文与核对边界');d.body.append(N('p','','本样机只核对了与上传转录的一致性，未重新见到教材原图。教材年份、印次未确定；approved=false。'),N('p','','教学题干、短标签与剧情旁白为改编；动物本领只用于这篇课文的情境。'));data.sources.forEach(s=>d.body.append(N('h3','',s.label),N('p','source-lines',s.text)));}
  function observe(){const d=modal('记录实际听到的表现');d.body.append(N('p','small','只记录发言者或被抽听的小组，不代表全班；不填写姓名。'));const label=N('label','','本次观察'),select=N('select');['尚未判断','说清了本领与理由','还需要继续练习'].forEach(t=>select.append(N('option','',t)));label.append(select);const note=N('textarea');note.placeholder='写一句实际听到的表达（可选）';note.maxLength=240;note.setAttribute('aria-label','观察备注');d.body.append(label,note,primary('保存这次观察',()=>{if(select.value==='尚未判断'&&!note.value.trim()){toast('尚未填写观察。');return;}log('teacher_observation',{scope:'本次抽听',mark:select.value,note:note.value.trim()});d.dialog.close();toast('已记下这次观察。');},'save-observation'));}
  function download(){const report={version:'visual-prototype-v3',scope:'本机精简样机；非旧版完整学情',events:state.events,notes:'不自动判断口头质量，不推断全班掌握；刷新后记录不保留。'};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'})),a=N('a');a.href=url;a.download='棉花姑娘-样机记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function cardContent(host){host.append(N('h1','','合上线索，再说一说'));['燕子为什么没能帮上忙？','把棉花姑娘的故事，讲给别人听。','青蛙没帮上忙，是不愿意帮助她吗？'].forEach((t,i)=>{host.append(N('p','',`${i+1}　${t}`),N('div','print-line'),N('div','print-line'));});host.append(N('small','','《棉花姑娘》· 口头检查卡 · 题目为教学改编，原文依据见教师页。不要求逐字背诵。'));}
  function checkCard(){const d=modal('课后检查卡');cardContent(d.body);d.body.append(primary('打印这张卡',()=>{document.querySelector('#print-card')?.remove();const n=N('article');n.id='print-card';n.style.display='none';cardContent(n);document.body.append(n);window.print();},'print'));}
  function restartDialog(){const d=modal('重新开始？');d.body.append(N('p','','会清空这份样机的当前进度。教师可先导出记录。'));d.body.append(primary('重新开始',()=>{d.dialog.close();audio.stop();stopSpeech();state=initial();token++;render();},'confirm-restart'));}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){audio.stop();stopSpeech();}else if(state.music&&!dialogOpen)audio.start().catch(()=>{});});
  window.addEventListener('beforeunload',()=>{audio.destroy();stopSpeech();});
  // Exposes current state for transparent testing; no teacher-only data is treated as secret.
  window.VisualCotton={getState:()=>JSON.parse(JSON.stringify(state)),version:'3.0-design-prototype'};
  render();
})();
</script></body></html>
